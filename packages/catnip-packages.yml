  Dashboard APIs; none are official. Every one of them is abandoned — the newest
  release is from 2021-07-03 and the oldest from 2017-10-15, all of them predating
  the current Contacts API on panel.chatfuel.com and the 2026 retirement of the
  docs.chatfuel.com developer reference they were written against.
