notes: >-
  Meta/WhatsApp conversation charges are billed by Meta and are outside Chatfuel's
  published price list. Nothing on the pricing page ties a tier to the Broadcasting
  API's 25 requests-per-second ceiling or to the Contacts API's 1,000-numbers-per-
  request cap; see rate-limits/catnip-rate-limits.yml.
