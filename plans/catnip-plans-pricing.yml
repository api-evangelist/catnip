description: >-
  Chatfuel prices the product, not the API. Two self-serve tiers are published — a
  free "Chatfuel Light" plan and a paid "AI PRO" plan at $49/month — plus a
  contact-sales path for volume. No plan line item mentions API access, API call
  quotas or API overage, and no per-tier rate limit is published; the pricing page
  says only "usage limits apply, see plan limits for details". The API tokens
  (Contacts, Broadcasting, Dashboard) are issued from the account regardless of
  tier, so API entitlement per plan is not stated anywhere public.
