apis:
- name: Chatfuel Contacts API
  description: >-
    Bulk-create WhatsApp contacts inside a Chatfuel automation. POST a list of up to
    1,000 E.164 phone numbers plus a contact_data.properties map of custom
    attributes applied to every contact in the request; the automation_id in the
    path is read from the automation's URL in the product. Authenticated with a
    Bearer API token generated at Settings, API. This is the only Chatfuel API with
    live public documentation as of 2026-08-13. No rate-limit headers are returned.
  humanURL: https://help.chatfuel.com/create-contacts-in-chatfuel-via-api-23134b06ecf8800683b6efacab24b68d
  baseURL: https://panel.chatfuel.com/api
  tags:
  - Contacts
  - WhatsApp
  - Bulk Import
  properties:
  - type: Authentication
    url: authentication/catnip-authentication.yml
  - type: RateLimits
    url: rate-limits/catnip-rate-limits.yml
  - type: ErrorCatalog
    url: errors/catnip-problem-types.yml
- name: Chatfuel Broadcasting API
  description: >-
    Programmatically send messages and trigger flows/blocks to a specific bot user
    on Messenger, Instagram, or WhatsApp. POST to the send endpoint with the bot's
    unique chatfuel_token and a flow name, block name, or block id; supports message
    tags for messaging outside the 24-hour window and setting user attributes. Rate
    limited to 25 requests per second per bot. The endpoint is still live and
    returns structured errors when probed, but its documentation was removed when
    the docs.chatfuel.com developer help centre was retired.
  humanURL: https://help.chatfuel.com
  baseURL: https://api.chatfuel.com
  x-documentation-status: retired
  x-retired-humanURL: https://docs.chatfuel.com/en/articles/790461-broadcasting-api
  x-retired-humanURL-status: 404
  x-retired-humanURL-probed: '2026-08-13'
  tags:
  - Messaging
  - Broadcast
  - Chatbots
  properties:
  - type: Authentication
    url: authentication/catnip-authentication.yml
  - type: RateLimits
    url: rate-limits/catnip-rate-limits.yml
  - type: ErrorCatalog
    url: errors/catnip-problem-types.yml
- name: Chatfuel Dashboard API
  description: >-
    Manage Chatfuel bots and their Facebook page bindings. Create empty bots, clone
    content between bots, generate role-scoped invite links (ADMIN, EDITOR, MARKETER,
    OPERATOR, VIEWER), and bind/unbind bots to Facebook pages. Authenticated with a
    Bearer Dashboard API Token generated from the account profile. Documented as
    primarily for internal use and subject to change; the documenting page has since
    been removed, though the endpoint still answers with a 401 envelope when probed.
  humanURL: https://help.chatfuel.com
  baseURL: https://dashboard.chatfuel.com/api
  x-documentation-status: retired
  x-retired-humanURL: https://docs.chatfuel.com/en/articles/2706667-dashboard-api
  x-retired-humanURL-status: 404
  x-retired-humanURL-probed: '2026-08-13'
