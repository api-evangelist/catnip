name: Catnip
description: >-
  Catnip Inc is the company behind Chatfuel, an AI-powered business messaging and
  chatbot automation platform for Facebook Messenger, Instagram, and WhatsApp.
  Chatfuel lets businesses build conversational flows, run broadcasts, qualify
  leads, book appointments, and automate customer support with AI agents. For
  developers Chatfuel exposes three public integration surfaces: a Broadcasting
  API for programmatically sending messages and triggering flows to bot users, a
  Dashboard API for managing bots and Facebook page bindings, and a JSON API
  plugin that lets a bot call an external backend and render dynamic content.
