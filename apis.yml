name: Catnip
description: >-
  Catnip Inc is the company behind Chatfuel, an AI-powered business messaging and
  chatbot automation platform for WhatsApp, Instagram, Facebook Messenger, TikTok
  and an embeddable website chat widget. Chatfuel lets businesses and agencies build
  conversational flows, run Meta click-to-WhatsApp ad funnels, qualify leads, book
  appointments and automate customer support with AI agents. Its developer surface
  is small and shrinking: the only currently documented API is a Contacts API that
  bulk-imports up to 1,000 phone numbers into an automation using a Bearer token
  from Settings, while the older Broadcasting API on api.chatfuel.com and Dashboard
  API on dashboard.chatfuel.com remain live on the wire but lost their
  documentation when the docs.chatfuel.com developer help centre was retired.
  Chatfuel publishes no OpenAPI, but it does serve an llms.txt and a real remote
  MCP documentation server on its academy docs host.
