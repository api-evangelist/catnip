- id: gdpr
  conforms: true
  evidence: https://chatfuel.com/gdpr (200) plus https://chatfuel.com/privacy-policy.html (200).
- id: tls-hsts
  conforms: true
  evidence: >-
    TLS 1.3 on every host. Strict-Transport-Security: max-age=31536000;
    includeSubDomains was returned on live API responses from api.chatfuel.com and
    panel.chatfuel.com and on chatfuel.com. Note the deterministic probe in
    security/catnip-domain-security.yml records hsts null for api.chatfuel.com and
    docs.chatfuel.com because it reads the header from a HEAD of the host root,
    which those hosts answer without it; the header is present on real API responses.
