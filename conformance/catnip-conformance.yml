provider: Chatfuel
providerId: catnip
description: >-
  Chatfuel's compliance posture is regulatory and platform-partnership, not
  API-standards. It publishes a GDPR page and a privacy policy and states official
  Meta Business / WhatsApp Business Solution partner status. On the wire it
  conforms to almost no cross-cutting API standard: no OpenAPI, no OAuth2/OIDC, no
  RFC 9457 problem details, no RFC 9116 security.txt of its own, no RFC 8594 sunset
  headers, no documented pagination or idempotency contract. Only HTTP bearer
  authentication (RFC 6750 shape) and TLS/HSTS are actually in place.
standards:
- id: openapi
  conforms: false
  evidence: >-
    /openapi.json, /openapi.yaml, /swagger.json, /api-docs, /docs and /redoc probed
    on api.chatfuel.com, dashboard.chatfuel.com, panel.chatfuel.com, chatfuel.com,
    docs.chatfuel.com, academy.chatfuel.com and docs.chatfuel.ai — all 404 or an
    HTML shell.
- id: oauth2
  conforms: false
  evidence: No oauth2 surface; /.well-known/oauth-authorization-server 404s on every real host.
- id: oidc
  conforms: false
