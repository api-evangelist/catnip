- id: rfc6750-bearer
  conforms: true
  evidence: >-
    Dashboard API and Contacts API both take Authorization: Bearer {token}; a
    missing header returns 401 (observed).
- id: rfc9457-problem-details
  conforms: false
  evidence: >-
    Errors return application/json vendor envelopes ({result,success,errors,message}
    and {code,message}), never application/problem+json. See errors/catnip-problem-types.yml.
- id: rfc9116-security-txt
  conforms: false
  evidence: >-
    No Chatfuel-authored /.well-known/security.txt. The only 200 belongs to Intercom
    on the retired docs host. See well-known/catnip-well-known.yml.
- id: rfc9727-api-catalog
  conforms: false
  evidence: academy.chatfuel.com serves /.well-known/api-catalog with an empty linkset; every other host 404s.
- id: rfc8594-sunset-header
  conforms: false
  evidence: No Sunset or Deprecation headers observed; no deprecation policy published.
- id: mcp
  conforms: true
  evidence: >-
    Remote MCP server at https://academy.chatfuel.com/_mcp/server answers tools/list
    with JSON-RPC 2.0 over text/event-stream (HTTP 200, anonymous). Documentation
